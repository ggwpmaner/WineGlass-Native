name: Build WineGlass IPA

on:
  workflow_dispatch:

  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: wineglass-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: WineGlass
  SCHEME: WineGlass
  BUNDLE_ID: com.wineglass.app
  IOS_DEPLOYMENT_TARGET: "17.0"

  # 当前 WineGlass 仓库使用的 iOS 27 构建环境
  SDKROOT: iphoneos27.0

  # 开发版 IPA：
  # - development: Development certificate + development provisioning profile
  # - ad-hoc:      Apple Distribution + Ad Hoc provisioning profile
  #
  # 这里默认 development，最适合你把 IPA 装到自己的测试设备。
  EXPORT_METHOD: development

jobs:
  build:
    name: Build WineGlass IPA
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      # ------------------------------------------------------------
      # 1. Checkout WineGlass
      # ------------------------------------------------------------
      - name: Checkout WineGlass
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. Show build environment
      # ------------------------------------------------------------
      - name: Show Xcode / SDK information
        shell: bash
        run: |
          set -euo pipefail

          echo "=== macOS ==="
          sw_vers

          echo
          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== Xcode path ==="
          xcode-select -p

          echo
          echo "=== iOS SDKs ==="
          xcodebuild -showsdks | grep -i iphoneos || true

          echo
          echo "=== SDKROOT ==="
          xcrun --sdk "${SDKROOT}" --show-sdk-path

      # ------------------------------------------------------------
      # 3. Install build dependencies
      # ------------------------------------------------------------
      - name: Install XcodeGen and GNU Make
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen make

          echo
          echo "=== XcodeGen ==="
          xcodegen version

          echo
          echo "=== GNU Make ==="
          gmake --version | head -n 1

      # ------------------------------------------------------------
      # 4. Prepare signing files
      #
      # Required GitHub Secrets:
      #
      # APPSTORE_CERTIFICATES_FILE_BASE64
      # APPSTORE_CERTIFICATES_PASSWORD
      # IOS_PROVISIONING_PROFILE_BASE64
      # IOS_CODE_SIGN_IDENTITY
      #
      # Example:
      # IOS_CODE_SIGN_IDENTITY = Apple Development
      #
      # If using Ad Hoc instead:
      # IOS_CODE_SIGN_IDENTITY = Apple Distribution
      # EXPORT_METHOD = ad-hoc
      # ------------------------------------------------------------
      - name: Check signing secrets
        shell: bash
        env:
          CERT_DATA: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          PROFILE_DATA: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail

          test -n "${CERT_DATA}" || {
            echo "::error::Missing APPSTORE_CERTIFICATES_FILE_BASE64"
            exit 1
          }

          test -n "${CERT_PASSWORD}" || {
            echo "::error::Missing APPSTORE_CERTIFICATES_PASSWORD"
            exit 1
          }

          test -n "${PROFILE_DATA}" || {
            echo "::error::Missing IOS_PROVISIONING_PROFILE_BASE64"
            exit 1
          }

          test -n "${CODE_SIGN_IDENTITY}" || {
            echo "::error::Missing IOS_CODE_SIGN_IDENTITY"
            exit 1
          }

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Install provisioning profile
        shell: bash
        env:
          PROFILE_DATA: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          PROFILE_FILE="$RUNNER_TEMP/WineGlass.mobileprovision"

          echo "$PROFILE_DATA" | base64 -D > "$PROFILE_FILE"

          # Decode mobileprovision plist
          security cms -D -i "$PROFILE_FILE" \
            -o "$RUNNER_TEMP/WineGlassProfile.plist"

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$RUNNER_TEMP/WineGlassProfile.plist"
          )

          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$RUNNER_TEMP/WineGlassProfile.plist"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/WineGlassProfile.plist"
          )

          TEAM_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:com.apple.developer.team-identifier" \
              "$RUNNER_TEMP/WineGlassProfile.plist"
          )

          echo "Profile UUID: ${PROFILE_UUID}"
          echo "Profile Name: ${PROFILE_NAME}"
          echo "Profile App ID: ${PROFILE_APP_ID}"
          echo "Team ID: ${TEAM_ID}"

          # Verify the profile is for the correct WineGlass bundle.
          case "${PROFILE_APP_ID}" in
            "${TEAM_ID}.${BUNDLE_ID}")
              echo "Provisioning profile matches ${BUNDLE_ID}"
              ;;
            *)
              echo "::error::Provisioning profile does not match ${BUNDLE_ID}"
              echo "::error::Found application-identifier: ${PROFILE_APP_ID}"
              exit 1
              ;;
          esac

          cp "$PROFILE_FILE" \
            "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"

          echo "PROFILE_UUID=${PROFILE_UUID}" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=${PROFILE_NAME}" >> "$GITHUB_ENV"
          echo "TEAM_ID=${TEAM_ID}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 5. Verify signing identity
      # ------------------------------------------------------------
      - name: Verify code signing identity
        shell: bash
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail

          echo "=== Installed code signing identities ==="
          security find-identity -v -p codesigning

          echo
          echo "=== Required identity ==="
          echo "${CODE_SIGN_IDENTITY}"

          security find-identity -v -p codesigning \
            | grep -F "${CODE_SIGN_IDENTITY}" || {
              echo "::error::Requested signing identity was not found."
              exit 1
            }

      # ------------------------------------------------------------
      # 6. Build Blink for iOS ARM64
      #
      # WineGlass README requires:
      #   cp config.h.ios config.h
      #   ./configure ...
      #   gmake ...
      # ------------------------------------------------------------
      - name: Clone Blink
        shell: bash
        run: |
          set -euo pipefail

          BLINK_DIR="$RUNNER_TEMP/blink"

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            "$BLINK_DIR"

          echo "BLINK_DIR=${BLINK_DIR}" >> "$GITHUB_ENV"

          cd "$BLINK_DIR"

          echo
          echo "=== Blink commit ==="
          git rev-parse HEAD

      - name: Configure Blink for iOS ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd "$BLINK_DIR"

          cp config.h.ios config.h

          IOS_SDK_PATH="$(xcrun --sdk "${SDKROOT}" --show-sdk-path)"
          IOS_CLANG="$(xcrun --sdk "${SDKROOT}" -f clang)"
          IOS_AR="$(xcrun --sdk "${SDKROOT}" -f ar)"

          echo "SDK: ${IOS_SDK_PATH}"
          echo "Clang: ${IOS_CLANG}"
          echo "AR: ${IOS_AR}"

          ./configure \
            CC="${IOS_CLANG}" \
            AR="${IOS_AR}" \
            CFLAGS="-g -O2 -arch arm64 \
              -isysroot ${IOS_SDK_PATH} \
              -miphoneos-version-min=${IOS_DEPLOYMENT_TARGET}" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

      - name: Build Blink static library
        shell: bash
        run: |
          set -euo pipefail

          cd "$BLINK_DIR"

          JOBS="$(sysctl -n hw.ncpu)"
          echo "Building Blink with ${JOBS} jobs"

          gmake -j"${JOBS}" o//blink/blink.a

      # ------------------------------------------------------------
      # 7. Copy Blink artifacts into WineGlass
      # ------------------------------------------------------------
      - name: Install Blink artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/Vendor/blink/lib"

          cp \
            "$BLINK_DIR/o//blink/blink.a" \
            "$GITHUB_WORKSPACE/Vendor/blink/lib/blink.a"

          echo
          echo "=== Blink library ==="
          ls -lh \
            "$GITHUB_WORKSPACE/Vendor/blink/lib/blink.a"

      # ------------------------------------------------------------
      # 8. Compile wg_blink_impl.c
      # ------------------------------------------------------------
      - name: Build WineGlass Blink bridge
        shell: bash
        run: |
          set -euo pipefail

          cd "$BLINK_DIR"

          IOS_SDK_PATH="$(xcrun --sdk "${SDKROOT}" --show-sdk-path)"
          IOS_CLANG="$(xcrun --sdk "${SDKROOT}" -f clang)"

          "${IOS_CLANG}" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -arch arm64 \
            -isysroot "${IOS_SDK_PATH}" \
            -miphoneos-version-min="${IOS_DEPLOYMENT_TARGET}" \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "${IOS_SDK_PATH}/usr/include" \
            -I. \
            -include config.h \
            "$GITHUB_WORKSPACE/Vendor/blink/wg_blink_impl.c" \
            -o "$GITHUB_WORKSPACE/Vendor/blink/lib/wg_blink_impl.o"

          echo
          echo "=== Blink bridge object ==="
          ls -lh \
            "$GITHUB_WORKSPACE/Vendor/blink/lib/wg_blink_impl.o"

      # ------------------------------------------------------------
      # 9. Generate Xcode project from project.yml
      # ------------------------------------------------------------
      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          xcodegen generate

          test -d WineGlass.xcodeproj || {
            echo "::error::WineGlass.xcodeproj was not generated."
            exit 1
          }

          echo
          echo "=== Generated project ==="
          ls -ld WineGlass.xcodeproj

      # ------------------------------------------------------------
      # 10. Inspect project
      # ------------------------------------------------------------
      - name: Show Xcode project settings
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration Release \
            -showBuildSettings \
            | grep -E \
              "PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" \
              || true

      # ------------------------------------------------------------
      # 11. Archive iOS app
      # ------------------------------------------------------------
      - name: Archive WineGlass
        shell: bash
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/WineGlass.xcarchive"

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk "${SDKROOT}" \
            -archivePath "${ARCHIVE_PATH}" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${CODE_SIGN_IDENTITY}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            IPHONEOS_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            clean \
            archive \
            | tee "$GITHUB_WORKSPACE/build/archive.log"

          test -d "${ARCHIVE_PATH}" || {
            echo "::error::Xcode archive was not created."
            exit 1
          }

      # ------------------------------------------------------------
      # 12. Generate ExportOptions.plist
      # ------------------------------------------------------------
      - name: Create ExportOptions.plist
        shell: bash
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/build/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>teamID</key>
            <string>${TEAM_ID}</string>

            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>

            <key>compileBitcode</key>
            <false/>

            <key>stripSwiftSymbols</key>
            <true/>

            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

          echo "=== ExportOptions.plist ==="
          cat "$GITHUB_WORKSPACE/build/ExportOptions.plist"

      # ------------------------------------------------------------
      # 13. Export IPA
      # ------------------------------------------------------------
      - name: Export IPA
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$GITHUB_WORKSPACE/build/WineGlass.xcarchive"
          EXPORT_DIR="$GITHUB_WORKSPACE/build/export"

          rm -rf "${EXPORT_DIR}"
          mkdir -p "${EXPORT_DIR}"

          xcodebuild \
            -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_DIR}" \
            -exportOptionsPlist \
              "$GITHUB_WORKSPACE/build/ExportOptions.plist" \
            | tee "$GITHUB_WORKSPACE/build/export.log"

          IPA_PATH="${EXPORT_DIR}/WineGlass.ipa"

          test -f "${IPA_PATH}" || {
            echo "::error::WineGlass.ipa was not generated."
            echo
            echo "=== Export directory ==="
            find "${EXPORT_DIR}" -maxdepth 2 -type f -print
            exit 1
          }

          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSIONED_IPA="${GITHUB_WORKSPACE}/build/WineGlass-${SHORT_SHA}.ipa"

          cp "${IPA_PATH}" "${VERSIONED_IPA}"

          echo
          echo "=== IPA generated ==="
          ls -lh "${IPA_PATH}"
          ls -lh "${VERSIONED_IPA}"

      # ------------------------------------------------------------
      # 14. Inspect IPA
      # ------------------------------------------------------------
      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail

          IPA="$GITHUB_WORKSPACE/build/WineGlass.ipa"

          unzip -l "${IPA}" | head -n 30

          echo
          echo "=== IPA payload ==="
          unzip -l "${IPA}" | grep "Payload/WineGlass.app/" | head -n 20 || true

          echo
          echo "IPA SHA256:"
          shasum -a 256 "${IPA}"

      # ------------------------------------------------------------
      # 15. Upload IPA
      # ------------------------------------------------------------
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: WineGlass-IPA-${{ github.sha }}
          path: |
            build/WineGlass.ipa
            build/WineGlass-*.ipa
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 16. Upload archive + logs
      # ------------------------------------------------------------
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: WineGlass-build-${{ github.sha }}
          path: |
            build/archive.log
            build/export.log
            build/ExportOptions.plist
          if-no-files-found: warn
          retention-days: 7
